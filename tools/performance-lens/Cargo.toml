[package]
name = "shelllist-perf"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "External Linux performance measurements for Shelllist"
publish = false

# Deliberately independent of application workspaces and production packaging.
[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
quick-xml = "0.38"
url = "2"
tempfile = "3.27"
