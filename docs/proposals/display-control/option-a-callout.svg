<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Option A — compact Displays callout</title><desc id="desc">A dedicated Displays callout with connected screens, a small arrangement preview, an automatic external-display preference, Identify and an Arrange and configure action. Explanatory notes sit to the left. Illustrative state: laptop and external display are both active.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#34444f"/></pattern></defs>
