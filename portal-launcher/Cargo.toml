[package]
name = "shelllist-portal-launch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
anyhow = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shelllist-hyprland = { path = "../../daemon-framework/crates/shelllist-hyprland" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
url = "2"
